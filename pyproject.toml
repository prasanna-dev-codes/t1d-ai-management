[project]
name = "t1d-ai-foundation"
version = "0.1.0"
description = "Research-only T1D AI engineering foundation; no clinical functionality"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv.workspace]
members = ["apps/api", "services/vision", "phases/phase-05-memory", "phases/phase-06-forecasting"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "httpx2==2.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "phases/phase-05-memory/tests", "phases/phase-06-forecasting/tests"]
addopts = "-ra --strict-markers"
pythonpath = ["apps/api/src", "services/vision/src", "phases/phase-05-memory/src", "phases/phase-06-forecasting/src"]
markers = ["integration: isolated PostgreSQL integration tests", "ml: optional model architecture/training/export engineering tests, no food accuracy claim"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", ".uv-cache", ".npm-cache", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["phases/phase-06-forecasting/src", "phases/phase-06-forecasting/tests", "services/vision/src", "phases/phase-05-memory/src", "phases/phase-05-memory/tests", "apps/api/src", "tests", "scripts", "infrastructure/migrations"]

[[tool.mypy.overrides]]
module = ["google.protobuf", "google.protobuf.*", "psutil", "psutil.*", "onnxruntime", "onnxruntime.*", "torch", "torch.*", "torchvision", "torchvision.*", "onnxscript", "onnxscript.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "xgboost", "xgboost.*"]
ignore_missing_imports = true
follow_imports = "skip"
