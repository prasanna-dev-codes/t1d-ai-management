[project]
name = "t1d-forecasting"
version = "0.1.0"
description = "Synthetic-qualified, research-only four-horizon CGM forecasting"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.14.2"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t1d_forecasting"]

