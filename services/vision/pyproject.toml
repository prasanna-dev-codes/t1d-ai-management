[project]
name = "t1d-vision"
version = "0.1.0"
description = "Dataset-independent, research-only food vision infrastructure"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.14.2", "Pillow==13.0.0", "numpy==2.5.4", "onnx==1.23.2", "onnxruntime==1.31.1", "psutil==7.2.2"]

[project.optional-dependencies]
train = ["torch==2.15.0", "torchvision==0.29.2", "onnxscript==0.7.2"]
train-cpu = ["torch==2.15.0", "torchvision==0.29.2", "onnxscript==0.7.2"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t1d_vision"]

[tool.uv]
conflicts = [[{extra = "train"}, {extra = "train-cpu"}]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "train-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
torchvision = [{ index = "pytorch-cpu", extra = "train-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
