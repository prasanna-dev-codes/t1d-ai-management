name: Research foundation
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned uv
        run: python -m pip install uv==0.13.6
      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: uv sync --frozen --all-packages
      - run: uv run --frozen --no-sync ruff check .
      - run: uv run --frozen --no-sync ruff format --check .
      - run: uv run --frozen --no-sync mypy
      - run: uv run --frozen --no-sync python scripts/export_contracts.py --check
      - run: uv run --frozen --no-sync python scripts/validate_vision_proposal.py
      - name: Unit and Phase 01-03 infrastructure regression tests
        run: uv run --frozen --no-sync pytest -q --ignore=tests/integration
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned uv
        run: python -m pip install uv==0.13.6
      - run: uv sync --frozen --all-packages
      - name: Verify pinned TimescaleDB and pgvector, migrate, and test isolation
        run: uv run --frozen --no-sync python scripts/run_database_tests.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:web
      - run: npm run build
